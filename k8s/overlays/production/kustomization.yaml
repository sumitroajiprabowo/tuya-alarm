apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml
  - ../../base
  - loadbalancer-service.yaml
  - networkpolicy.yaml

images:
  - name: sumitroajiprabowo/tuya-alarm
    newTag: latest

replicas:
  - name: tuya-alarm
    count: 1

patches:
  # Deployment patch - Environment & Resources
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tuya-alarm
      spec:
        template:
          spec:
            containers:
            - name: tuya-alarm
              env:
              - name: ENV
                value: "production"
              resources:
                limits:
                  memory: "512Mi"
                  cpu: "500m"
                requests:
                  memory: "256Mi"
                  cpu: "200m"