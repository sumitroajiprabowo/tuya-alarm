apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tuya-alarm-network-policy
  labels:
    app: tuya-alarm
spec:
  podSelector:
    matchLabels:
      app: tuya-alarm
  policyTypes:
    - Ingress
  ingress:
    # Allow all traffic on port 5000
    - ports:
        - protocol: TCP
          port: 5000